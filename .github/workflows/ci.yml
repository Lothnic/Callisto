name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firefox:
    name: Firefox bridge (Rust + extension + launcher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/mini/package-lock.json
      - run: cargo test --locked --manifest-path packages/firefox-rs/Cargo.toml
      - run: cargo build --locked --manifest-path packages/firefox-rs/Cargo.toml --bin callisto-firefox-tab-mcp
      - run: cargo build --locked --release --manifest-path packages/firefox-rs/Cargo.toml --bin callisto-firefox-tab-mcp
      - run: npm --prefix packages/mini ci
      - run: npm --prefix packages/mini run build
      - run: node --test packages/firefox-rs/tests/extension-background.test.cjs scripts/launcher.test.mjs scripts/install-release.test.mjs
      - name: DOM bridge tests in runner Chrome
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome)"
          test -n "$CHROMIUM_PATH"
          node packages/firefox-rs/tests/extension-content.mjs
      - name: Firefox extension bridge end-to-end
        timeout-minutes: 5
        run: |
          command -v firefox
          command -v geckodriver
          geckodriver --host 127.0.0.1 --port 4444 > /tmp/callisto-geckodriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4444/status >/dev/null; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:4444/status >/dev/null
          python3 packages/firefox-rs/tests/firefox-bridge-smoke.py
  mini:
    name: packages/mini (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/mini/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mini-browser:
    name: Chromium local browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/mini/package-lock.json
      - run: npm ci
      - name: Exercise Chromium against local fixtures
        env:
          CALLISTO_SMOKE: '1'
          CALLISTO_NO_SANDBOX: '1'
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          test -n "$CHROME_PATH"
          node --import tsx --test --test-concurrency=1 tests/mcp.test.ts tests/actionability.test.ts tests/engine.test.ts tests/attached.test.ts

  harness:
    name: harness (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harness/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check callisto tests
      - run: pytest

  eval:
    name: eval (offline tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check callisto_eval tests
      - run: pytest
      - run: python -m callisto_eval run webvoyager --subset smoke --agent fake --out runs/ci-webvoyager-smoke
