name: Eval

on:
  pull_request:
    paths:
      - "eval/**"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
    paths:
      - "eval/**"
      - ".github/workflows/eval.yml"

jobs:
  offline-eval:
    name: eval offline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest
      - run: python -m callisto_eval run webvoyager --subset smoke --agent fake --out runs/ci-webvoyager-smoke
