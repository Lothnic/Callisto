[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "callisto-harness"
version = "0.1.0"
description = "Agent harness for the Callisto agentic browser."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "click>=8.1",
    "keyring>=25.0",
]

[project.optional-dependencies]
memory = [
    "sentence-transformers>=2.2",
    "numpy>=1.24",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
callisto = "callisto.cli:cli"

[tool.setuptools.packages.find]
where = ["."]  # harness/ is the root; find callisto/ package

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Start lenient: catch real bugs without blocking the whole tree.
select = ["E9", "F63", "F7", "F82"]
