[package]
name = "callisto-firefox"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Firefox and Zen runtime for Callisto over WebDriver BiDi"
repository = "https://github.com/Lothnic/Callisto"
readme = "README.md"

[[bin]]
name = "callisto-firefox-mcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "callisto-firefox-tab-mcp"
path = "src/tab_mcp.rs"
