<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
body{font:14px system-ui;margin:16px;width:290px;background:#12191c;color:#edf2f3}h1{font-size:17px;margin:0 0 10px}p{line-height:1.45;color:#c9d3d7}input{box-sizing:border-box;width:100%;padding:9px;background:#202c32;color:white;border:1px solid #72848b}button{padding:9px 12px;background:#3987d0;color:white;border:0;margin:8px 3px 0 0;cursor:pointer}#status{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}</style></head><body>
<h1>Callisto tab bridge</h1><p>Enter the pairing code from Callisto, then share the tab you want the agent to use. The agent can read and change that page.</p>
<label for="code">Pairing code</label><input id="code" autocomplete="off" spellcheck="false"><button id="pair">Connect</button><button id="share">Share this tab</button><button id="stop">Stop sharing</button><p id="status" role="status"></p><script src="popup.js"></script></body></html>
